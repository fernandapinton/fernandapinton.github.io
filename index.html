<!doctype html>
<html lang="pt-BR" data-theme="dark" data-theme-preference="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fernanda Pinton, cantora de Belo Horizonte. MPB, jazz e pop em apresentações intimistas para shows, recepções e celebrações. Ouça e assista." />
    <meta name="theme-color" content="#16001e" />
    <script>
      (() => {
        let preference = 'dark'
        try {
          const saved = localStorage.getItem('fefe-theme-preference')
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved
        } catch {}
        const theme = preference === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.themePreference = preference
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#160f1b' : '#fffcf2'
      })()
    </script>
    <title>Fernanda Pinton | Cantora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
